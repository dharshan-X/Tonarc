Categories:
  - Multimedia
License: GPL-3.0-or-later
AuthorName: quietrays
SourceCode: https://github.com/dharshan-X/Tonarc
IssueTracker: https://github.com/dharshan-X/Tonarc/issues
Changelog: https://github.com/dharshan-X/Tonarc/blob/main/CHANGELOG.md

AutoName: Tonarc
Summary: Modern local & hybrid music player with smart queue, auto-lyrics & mixes
Description: |-
  Tonarc is a modern, expressive local and hybrid music player for Android.
  Features include smart queue replenishment, dynamic mixes, synced lyrics,
  vinyl turntable audio visualizers, and offline-first library support.

RepoType: git
Repo: https://github.com/dharshan-X/Tonarc.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0-alpha.5
    subdir: app
    gradle:
      - yes
    prebuild:
      - sed -i "s/ -XX:+ParallelRefParsingEnabled//" ../gradle.properties
    gradleprops:
      - tonarc.enableAbiSplits=false
      - tonarc.disableReleaseSigning=true

AntiFeatures:
  - NonFreeNet

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+-alpha\.[0-9]+$
UpdateCheckData: gradle.properties|APP_VERSION_CODE=(\d+)|.|APP_VERSION_NAME=(.+)
CurrentVersion: 0.1.0
CurrentVersionCode: 1
