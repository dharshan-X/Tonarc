name: Build & Test (CI)

on:
  push:
    branches:
      - main
      - Recomendation
      - 'feature/**'
      - 'fix/**'
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "LICENSE"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - main
      - Recomendation
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Also assemble release APKs'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-phone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Set up CI keystore
        env:
          CI_KEYSTORE_B64: ${{ secrets.CI_KEYSTORE_B64 }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          CI_KEYSTORE_ALIAS: ${{ secrets.CI_KEYSTORE_ALIAS }}
        run: |
          if [ -n "$CI_KEYSTORE_B64" ] && [ -n "$CI_KEYSTORE_PASSWORD" ]; then
            KEYSTORE_PASSWORD="$CI_KEYSTORE_PASSWORD"
            printf '%s' "$CI_KEYSTORE_B64" | base64 -d > tonarc-ci.jks
            KEY_ALIAS="${CI_KEYSTORE_ALIAS:-}"
            if [ -z "$KEY_ALIAS" ]; then
              KEY_ALIAS="$(keytool -list -keystore tonarc-ci.jks -storepass "$KEYSTORE_PASSWORD" | grep -i "PrivateKeyEntry" | head -n 1 | cut -d, -f1 | xargs || true)"
            fi
            if [ -z "$KEY_ALIAS" ]; then
              KEY_ALIAS="$(keytool -list -keystore tonarc-ci.jks -storepass "$KEYSTORE_PASSWORD" | grep -i "Entry" | head -n 1 | cut -d, -f1 | xargs || true)"
            fi
            if [ -z "$KEY_ALIAS" ]; then
              KEY_ALIAS="tonarc-ci-key"
            fi
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_ALIAS="tonarc-ci-key"
            keytool -genkey -v -keystore tonarc-ci.jks -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=Tonarc CI Throwaway, OU=Dev, O=QuietRays, L=World, S=World, C=US"
          fi
          {
            echo "storeFile=tonarc-ci.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --info --stacktrace

      - name: Upload Test Results (on failure)
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-and-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug -Ptonarc.enableAbiSplits=true --info --stacktrace

      - name: Verify Debug Split APKs
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          for apk in \
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          do
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" >/dev/null
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
          done

      - name: Upload Debug APK Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Tonarc-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Assemble Release APK
        run: ./gradlew :app:assembleRelease -Ptonarc.enableAbiSplits=true --info --stacktrace

      - name: Verify Release Split APKs
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          for apk in \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          do
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" >/dev/null
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
          done

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Tonarc-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
