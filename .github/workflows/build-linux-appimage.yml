name: Build Linux AppImage

on:
  push:
    branches:
      - main
      - Recomendation
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'desktop/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'assets/icon.png'
      - 'app/src/main/java/com/quietrays/tonarc/data/model/Lyrics.kt'
      - 'app/src/main/java/com/quietrays/tonarc/data/network/lyrics/**'
      - 'app/src/main/java/com/quietrays/tonarc/data/network/youtube/InnertubeModels.kt'
      - 'app/src/main/java/com/quietrays/tonarc/data/network/youtube/InnertubeParser.kt'
      - 'app/src/main/java/com/quietrays/tonarc/data/network/youtube/NewPipeDownloader.kt'
      - 'app/src/main/java/com/quietrays/tonarc/utils/TtmlLyricsParser.kt'
      - '.github/workflows/build-linux-appimage.yml'
  pull_request:
    branches:
      - main
      - Recomendation
    paths:
      - 'desktop/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'assets/icon.png'
      - '.github/workflows/build-linux-appimage.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (leave blank to use gradle.properties)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-linux-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-appimage:
    runs-on: ubuntu-24.04
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute AppImage Version
        id: version
        run: |
          BASE_VERSION="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          INPUT_VERSION="${{ inputs.version_name }}"
          VERSION_NAME="${INPUT_VERSION:-$BASE_VERSION}"
          VERSION_NAME="${VERSION_NAME#v}"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils \
            squashfs-tools \
            fakeroot \
            binutils \
            rpm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Run Desktop Unit Tests
        run: ./gradlew :desktop:test --info --stacktrace

      - name: Upload Desktop Test Results (on failure)
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-test-results
          path: |
            desktop/build/reports/
            desktop/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Compose Desktop Distributable
        run: ./gradlew :desktop:createReleaseDistributable -PAPP_VERSION_NAME="${{ steps.version.outputs.name }}" --info --stacktrace

      - name: Package Linux AppImage
        run: |
          chmod +x desktop/packaging/linux/AppRun desktop/packaging/linux/build-appimage.sh
          desktop/packaging/linux/build-appimage.sh "${{ steps.version.outputs.name }}"

      - name: Verify AppImage Bundle
        run: |
          APPIMAGE_FILE="desktop/build/appimage/Tonarc-${{ steps.version.outputs.name }}-linux-x86_64.AppImage"
          test -x "$APPIMAGE_FILE"
          file "$APPIMAGE_FILE"
          (cd desktop/build/appimage && sha256sum -c "$(basename "$APPIMAGE_FILE").sha256")
          TMP_EXTRACT="$(mktemp -d)"
          (cd "$TMP_EXTRACT" && "$OLDPWD/$APPIMAGE_FILE" --appimage-extract >/dev/null)
          test -x "$TMP_EXTRACT/squashfs-root/AppRun"
          test -x "$TMP_EXTRACT/squashfs-root/usr/bin/Tonarc"
          desktop-file-validate "$TMP_EXTRACT/squashfs-root/com.quietrays.tonarc.desktop"
          rm -rf "$TMP_EXTRACT"

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Tonarc-linux-x86_64-${{ steps.version.outputs.name }}
          path: |
            desktop/build/appimage/Tonarc-${{ steps.version.outputs.name }}-linux-x86_64.AppImage
            desktop/build/appimage/Tonarc-${{ steps.version.outputs.name }}-linux-x86_64.AppImage.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
